<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de estatus</title>
    <link rel="stylesheet" href="./css/estilos.css">
</head>
<body>
    <header class="header">
        <div class="logo">
            <img src="css\images\assets\LogoPacketWorld.png" alt="Packet-World Logo" class="logo-img">
            <h1>Packet-World</h1>
        </div> 
        <div class="search-box">
            <input id= "inputNoGuia" type="text" placeholder="No. de Guía">
            <button onclick="buscarEnvio()" class="search-btn">🔍</button>
        </div>
    </header>
    <div class="layout">
    <aside class="side"></aside>

    <main class="content">

        <h2 class="titulo">Historial de Estatus</h2>
        <h3>No. de Guía:</h3>
        <label id="lbNoGuia">[No Guía]</label>

        <table>
            <thead>
              <tr>
                <th>Estatus</th>
                <th>Fecha y hora</th>
                <th>Motivo</th>
              </tr>
            </thead>
          
            <tbody id="tablaHistorial">
              
            </tbody>
          </table>
    </main> 
    
    <aside class="side"></aside>
    </div>
<script src="js/historial.js"></script>
<script src="js/detalles.js"></script>
</body>
</html>
